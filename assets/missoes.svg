<svg xmlns="http://www.w3.org/2000/svg" width="830" height="270" viewBox="0 0 830 270"><defs><path id="s4" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/><path id="hr" d="M0,9 C-12,1 -8,-9 0,-3 C8,-9 12,1 0,9Z"/><path id="st" d="M0,-20 L4.7,-6.5 L19,-6.2 L7.6,2.5 L11.8,16.2 L0,8 L-11.8,16.2 L-7.6,2.5 L-19,-6.2 L-4.7,-6.5Z"/></defs><style>.fb{transform-box:fill-box;transform-origin:center}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-7px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(0)}}
.draw{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cur{animation:cur 1.4s ease-in-out infinite}
@keyframes cur{50%{stroke:#FFD23F;stroke-width:4}}</style><rect class="pop" style="animation-delay:0.0s;transform-box:fill-box;transform-origin:center" x="20" y="14" width="28" height="28" rx="8" fill="#FF8FBF"/><path class="draw" style="animation-delay:0.4s" d="M27,28 L32,34 L42,22" stroke="#FFF3B0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="34" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" fill="#C27A9B" text-decoration="line-through">Despertar os poderes estelares (iniciar ADS)</text><rect class="pop" style="animation-delay:0.3s;transform-box:fill-box;transform-origin:center" x="20" y="58" width="28" height="28" rx="8" fill="#FF8FBF"/><path class="draw" style="animation-delay:0.7s" d="M27,72 L32,78 L42,66" stroke="#FFF3B0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="78" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" fill="#C27A9B" text-decoration="line-through">Conquistar 4 joias da coroa (certificações)</text><rect class="pop" style="animation-delay:0.6s;transform-box:fill-box;transform-origin:center" x="20" y="102" width="28" height="28" rx="8" fill="#FF8FBF"/><path class="draw" style="animation-delay:1.0s" d="M27,116 L32,122 L42,110" stroke="#FFF3B0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="122" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" fill="#C27A9B" text-decoration="line-through">Primeiro projeto em equipe (Santo Taquito)</text><rect x="20" y="146" width="28" height="28" rx="8" fill="#FFF6CF" stroke="#E0568F" stroke-width="2.5" class="cur"/><text x="62" y="166" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" font-weight="bold" fill="#9C2A5E">Dominar o feitiço do SQL e Banco de Dados</text><g class="pulse" style="transform-box:fill-box;transform-origin:center"><rect x="440" y="148" width="120" height="24" rx="12" fill="#FFD23F"/><text x="500" y="165" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="13" font-weight="bold" fill="#9C2A5E">em andamento</text></g><rect x="20" y="190" width="28" height="28" rx="8" fill="#FFF6CF" stroke="#FFC2DA" stroke-width="2.5" class=""/><text x="62" y="210" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" font-weight="normal" fill="#9C2A5E">Unir negócios e tecnologia em um projeto real</text><rect x="20" y="234" width="28" height="28" rx="8" fill="#FFF6CF" stroke="#FFC2DA" stroke-width="2.5" class=""/><text x="62" y="254" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" font-weight="normal" fill="#9C2A5E">Conquistar a primeira vaga em tecnologia</text></svg>