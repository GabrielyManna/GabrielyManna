.fall{animation:fall 5s linear infinite}@keyframes fall{0%{opacity:0;transform:translateY(-20px)}15%{opacity:1}100%{opacity:0;transform:translateY(200px)}}
.in{animation:in 1.2s cubic-bezier(.2,1.4,.4,1) both}@keyframes in{from{opacity:0;transform:translateY(18px)}}
.crownb{animation:cb 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes cb{50%{transform:translateY(-6px) rotate(-3deg)}}
