<svg xmlns="http://www.w3.org/2000/svg" width="830" height="460" viewBox="0 0 830 460"><defs><path id="s4" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/><path id="hr" d="M0,9 C-12,1 -8,-9 0,-3 C8,-9 12,1 0,9Z"/><path id="st" d="M0,-20 L4.7,-6.5 L19,-6.2 L7.6,2.5 L11.8,16.2 L0,8 L-11.8,16.2 L-7.6,2.5 L-19,-6.2 L-4.7,-6.5Z"/></defs><style>.fb{transform-box:fill-box;transform-origin:center}
.tw{animation:tw 2.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
.float{animation:fl 3.5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.15)}}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink 4s infinite}@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.1)}}
.shadow{animation:sh 3.5s ease-in-out infinite}@keyframes sh{50%{transform:scale(.72);opacity:.3}}
.shine{animation:shine 4s ease-in-out infinite}@keyframes shine{0%,60%{transform:translateX(-200px) skewX(-20deg)}100%{transform:translateX(1000px) skewX(-20deg)}}
.cardf{animation:fl 4s ease-in-out infinite}
