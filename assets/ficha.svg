class="tw fb" fill="#FFD23F" style="animation-delay:0.6000000000000001s"/></g><g transform="translate(758,84) scale(.42)"><use href="#st" class="tw fb" fill="#FFD23F" style="animation-delay:0.8s"/></g><text x="415" y="130" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#9C2A5E">Sou profissional de financiamento e crédito imobiliário e estudante de Análise e</text><text x="415" y="149" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#9C2A5E">Desenvolvimento de Sistemas. Uso minha experiência com processos, documentação e</text><text x="415" y="168" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#9C2A5E">clientes para criar soluções mais eficientes com tecnologia.</text><g class="pop2" style="animation-delay:0.2s"><rect x="80" y="191" width="670" height="26" rx="13" fill="#FFE4EE"/><g transform="translate(100,204) scale(0.9900000000000001)"><use href="#hr" class="pulse fb" fill="#E0568F" stroke="#C2185B" stroke-width="1" style="animation-delay:0.0s"/></g><text x="118" y="209" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="bold" fill="#C2185B">NOME</text><text x="240" y="209" text-anchor="start" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="normal" fill="#9C2A5E">Gabriely Moreira Manna</text></g><g class="pop2" style="animation-delay:0.35s"><rect x="80" y="225" width="670" height="26" rx="13" fill="#FFF0B8"/><g transform="translate(100,238) scale(0.9900000000000001)"><use href="#s4" class="pulse fb" fill="#FFD23F" stroke="#E8A800" stroke-width="1" style="animation-delay:0.2s"/></g><text x="118" y="243" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="bold" fill="#C2185B">CLASSE</text><text x="240" y="243" text-anchor="start" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="normal" fill="#9C2A5E">Estudante de ADS</text></g><g class="pop2" style="animation-delay:0.5s"><rect x="80" y="259" width="670" height="26" rx="13" fill="#FFE4EE"/><g transform="translate(100,272) scale(0.63)"><use href="#st" class="pulse fb" fill="#E0568F" stroke="#C2185B" stroke-width="1" style="animation-delay:0.4s"/></g><text x="118" y="277" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="bold" fill="#C2185B">ORIGEM</text><text x="240" y="277" text-anchor="start" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="normal" fill="#9C2A5E">Crédito imobiliário, administrativo e jurídico</text></g><g class="pop2" style="animation-delay:0.6499999999999999s"><rect x="80" y="293" width="670" height="26" rx="13" fill="#FFF0B8"/><g transform="translate(100,306) scale(0.9900000000000001)"><use href="#hr" class="pulse fb" fill="#FFD23F" stroke="#E8A800" stroke-width="1" style="animation-delay:0.6000000000000001s"/></g><text x="118" y="311" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="bold" fill="#C2185B">ELEMENTOS</text><text x="240" y="311" text-anchor="start" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="normal" fill="#9C2A5E">Front-End e Banco de Dados</text></g><g class="pop2" style="animation-delay:0.8s"><rect x="80" y="327" width="670" height="26" rx="13" fill="#FFE4EE"/><g transform="translate(100,340) scale(0.9900000000000001)"><use href="#s4" class="pulse fb" fill="#E0568F" stroke="#C2185B" stroke-width="1" style="animation-delay:0.8s"/></g><text x="118" y="345" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="bold" fill="#C2185B">CORAÇÃO</text><text x="240" y="345" text-anchor="start" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="normal" fill="#9C2A5E">Unir visão de negócios e tecnologia</text></g><g class="pop2" style="animation-delay:0.95s"><rect x="80" y="361" width="670" height="45" rx="13" fill="#FFF0B8"/><g transform="translate(100,374) scale(0.63)"><use href="#st" class="pulse fb" fill="#FFD23F" stroke="#E8A800" stroke-width="1" style="animation-delay:1.0s"/></g><text x="118" y="379" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="bold" fill="#C2185B">DONS</text><text x="240" y="379" text-anchor="start" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="normal" fill="#9C2A5E">Comunicação assertiva, adaptabilidade, resolução de</text><text x="240" y="398" text-anchor="start" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="15" font-weight="normal" fill="#9C2A5E">problemas e foco em resultados</text></g><g clip-path="url(#cc)"><rect class="shine" x="0" y="0" width="60" height="460" fill="#fff" opacity=".35"/></g></g></svg>