<svg xmlns="http://www.w3.org/2000/svg" width="830" height="200" viewBox="0 0 830 200"><defs><path id="s4" d="M0,-10 C1,-2 2,-1 10,0 C2,1 1,2 0,10 C-1,2 -2,1 -10,0 C-2,-1 -1,-2 0,-10Z"/><path id="hr" d="M0,9 C-12,1 -8,-9 0,-3 C8,-9 12,1 0,9Z"/><path id="st" d="M0,-20 L4.7,-6.5 L19,-6.2 L7.6,2.5 L11.8,16.2 L0,8 L-11.8,16.2 L-7.6,2.5 L-19,-6.2 L-4.7,-6.5Z"/></defs><style>.fb{transform-box:fill-box;transform-origin:center}
