.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1.1)}}
.shadow{animation:sh 3.5s ease-in-out infinite}@keyframes sh{50%{transform:scale(.72);opacity:.3}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.8s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}
.shine{animation:shine 2.5s ease-in-out infinite}@keyframes shine{from{transform:translateX(-60px) skewX(-20deg)}to{transform:translateX(460px) skewX(-20deg)}}
